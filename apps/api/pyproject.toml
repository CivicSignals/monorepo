[project]
name = "civicsignals-api"
version = "0.1.0"
description = "CivicSignals backend — FastAPI modulith + Celery workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "httpx>=0.27",
    "boto3>=1.35",
    "pgvector>=0.3",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy, connector-specific deps. Installed in the worker_ingest / worker_extract
# images, not the api image. See infra/Dockerfile (TODO D2, D6, E9).
ingestion = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "feedparser>=6.0",
    "playwright>=1.47",
]
extraction = [
    "pdfplumber>=0.11",
    "anthropic>=0.39",
    "openai>=1.51",
    "spacy>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "schemathesis>=3.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicsignals_api"]

[tool.uv]
package = true

# ----------------------------------------------------------------------------
# Lint + format (ruff replaces black + isort + flake8)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["civicsignals_api"]

# ----------------------------------------------------------------------------
# Type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Celery ships no py.typed marker, so `@celery_app.task` is an untyped decorator.
# Relax just this one strict sub-flag rather than scatter per-task `type: ignore`s.
disallow_untyped_decorators = false
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# anthropic + openai live in the `extraction` optional extra and are imported
# lazily by the LLM gateway backends (TODO E2), so the core api type-checks
# without them installed. spacy is in the same extra.
module = [
    "pgvector.*",
    "feedparser.*",
    "pdfplumber.*",
    "celery.*",
    "anthropic.*",
    "openai.*",
    "spacy.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
addopts = "--cov=civicsignals_api --cov-report=term-missing"
