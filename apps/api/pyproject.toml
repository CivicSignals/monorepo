[project]
name = "civicsignals-api"
version = "0.1.0"
description = "CivicSignals backend — FastAPI modulith + Celery workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "httpx>=0.27",
    "boto3>=1.35",
    "pgvector>=0.3",
    "passlib[bcrypt]>=1.7",
    # Pin bcrypt to the 4.0.x line: passlib 1.7.4 reads ``bcrypt.__about__`` for
    # the backend version, which bcrypt removed in 4.1+, and bcrypt 4.1+ also
    # raises on >72-byte secrets instead of truncating. Both break passlib's
    # bcrypt handler. (B1; revisit when passlib ships a 1.7.4+ fix.)
    "bcrypt>=4.0.1,<4.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    # Symmetric encryption of integration OAuth tokens at rest (K1). Unlike API
    # tokens (B8, hashed — never recovered), OAuth access/refresh tokens must be
    # *decryptable* to call the provider, so they are Fernet-encrypted with a
    # key derived from INTEGRATIONS_TOKEN_ENCRYPTION_KEY (threat-model §4.2).
    "cryptography>=43.0",
    "pyyaml>=6.0",
    # Recipe DSL + runner (D1). jsonschema validates recipe YAML against the
    # canonical draft-07 schema (packages/recipe-schema); beautifulsoup4 backs
    # the runner's default HTML extractor. Both are light and live in *core*
    # (not the `ingestion` extra) because any process that runs a recipe needs
    # them and the Docker images install with `uv sync --no-dev` (no extras).
    "jsonschema>=4.23",
    "beautifulsoup4>=4.12",
    # Stripe billing SDK (N1). Version pinned to major for API stability.
    "stripe>=11.0",
    # Observability (A6). All three are config-gated: Sentry is a no-op when
    # SENTRY_DSN is unset; OTel is a no-op when OTEL_EXPORTER_OTLP_ENDPOINT is
    # unset; prometheus-client exposes /metrics (always on, no external account
    # needed). The OTel packages are kept light — we only pull the OTLP exporter
    # and the SQLAlchemy + ASGI instrumentations.
    "sentry-sdk[fastapi]>=2.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "prometheus-client>=0.21",
    "starlette-prometheus>=0.10",
]

[project.optional-dependencies]
# Heavy, connector-specific deps. Installed in the worker_ingest / worker_extract
# images, not the api image. See infra/Dockerfile (TODO D2, D6, E9).
# (beautifulsoup4 is in core `dependencies` above — the recipe runner needs it.)
ingestion = [
    "lxml>=5.3",
    "feedparser>=6.0",
    "playwright>=1.47",
]
extraction = [
    "pdfplumber>=0.11",
    "anthropic>=0.39",
    "openai>=1.51",
    "spacy>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "schemathesis>=3.36",
    # Typing stubs for the recipe runner's deps (D1).
    "types-jsonschema>=4.23",
    "types-beautifulsoup4>=4.12",
    "types-pyyaml>=6.0",
    # Typing stubs for passlib (auth password hashing, B1).
    "types-passlib>=1.7",
    # In-memory S3 mock for the raw-document storage tests (D3) so no real
    # network/MinIO is needed; pinned to the s3 extra to keep the install slim.
    "moto[s3]>=5.0",
    # In-memory SQLite backend for billing unit tests (N1); avoids needing
    # Postgres for tests that don't touch CITEXT / pgvector.
    "aiosqlite>=0.20",
    # Load test runner (QA-3). Locust is dev-only — it is NOT installed in the
    # api runtime image (uv sync --no-dev in Dockerfile). Scenarios live in
    # load/ at the repo root; the R3 task executes the real load runs.
    "locust>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicsignals_api"]

[tool.uv]
package = true

# ----------------------------------------------------------------------------
# Lint + format (ruff replaces black + isort + flake8)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["civicsignals_api"]

# ----------------------------------------------------------------------------
# Type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Celery ships no py.typed marker, so `@celery_app.task` is an untyped decorator.
# Relax just this one strict sub-flag rather than scatter per-task `type: ignore`s.
disallow_untyped_decorators = false
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# anthropic + openai live in the `extraction` optional extra and are imported
# lazily by the LLM gateway backends (E2), so the core api type-checks without
# them installed. spacy is in the same extra.
module = [
    "pgvector.*",
    "feedparser.*",
    "pdfplumber.*",
    # playwright lives in the `ingestion` extra and is imported lazily by the
    # headless-browser fetcher (D2), so the core api type-checks without it.
    "playwright.*",
    "celery.*",
    "anthropic.*",
    "openai.*",
    "spacy.*",
    # boto3/botocore ship no inline types (the s3 client is dynamically built),
    # and moto is a test-only dependency without bundled stubs (D3 raw storage).
    "boto3.*",
    "botocore.*",
    "moto.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OTel and starlette-prometheus ship incomplete type annotations (A6).
module = [
    "opentelemetry.*",
    "starlette_prometheus.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# stripe SDK ships partial/no py.typed; ignore missing stubs (N1).
module = ["stripe.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
addopts = "--cov=civicsignals_api --cov-report=term-missing"
