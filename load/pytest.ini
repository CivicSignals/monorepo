[pytest]
# Load test suite smoke checks (QA-3).
# Run from the repo root: PYTHONPATH=. pytest load/ -q
# These are import/structural checks only — no real load is generated.
#
# --assert=plain avoids pytest's assertion rewriter importing ssl before gevent
# can monkey-patch it, which causes RecursionError (gevent/issues/1016).
testpaths = load/tests
addopts = --assert=plain
