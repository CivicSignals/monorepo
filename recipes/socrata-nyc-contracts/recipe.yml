# NYC OpenData awarded construction contracts via Socrata (doc 18 §5 wave 2 #9).
# Instantiates the multi-tenant `socrata` connector (TODO D7) against the live
# "Directory Of Awarded Construction Contracts" dataset (j7gw-gcxi). The
# `dd[data-key=...]` selectors read the connector's JSON->HTML projection by the
# dataset's SODA field names. Public open-data; no auth required (app_token
# optional). Verified live against data.cityofnewyork.us.
recipe_id: socrata-nyc-contracts
connector: socrata
version: 1

entity:
  name: New York City
  state: NY
  kind: city

schedule:
  cron: "0 6 * * *" # daily

# Open-data API access is by app token, not robots-gated; politeness still applies
# between the runner's per-record fetches (which are local, post-discover).
fetch:
  respect_robots_txt: false
  politeness_seconds: 0

# Pre-vetted open-data feed: skip the Stage-2 relevance classifier (doc 19 §3).
prefilter: assume_relevant

connector_config:
  socrata:
    domain: data.cityofnewyork.us
    dataset_id: j7gw-gcxi
    order: ":id"
    page_size: 100
    max_pages: 20

# The connector projects each SODA row into an HTML <dl>; fields select the
# column by data-key (doc 18 §3.4 ordered selectors: primary -> fallbacks).
# Columns: pin, description, selected_firm, value (no award date in this dataset).
fields:
  title:
    selectors:
      - "dd[data-key='description']"
    required: true
  vendor:
    selectors:
      - "dd[data-key='selected_firm']"
    required: false
  award_amount:
    selectors:
      - "dd[data-key='value']"
    required: false
  contract_id:
    selectors:
      - "dd[data-key='pin']"
    required: false

signal_types:
  - contract_award
