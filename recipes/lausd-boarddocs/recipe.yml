# K-12 wedge — Los Angeles Unified School District board meetings via BoardDocs
# (doc 16 §14 recipes #23-40 top WA/OR/CA K-12 districts; doc 15 §3 wedge 1).
# Instantiates the multi-tenant `boarddocs` connector (TODO D7) for the largest
# CA district. Public agendas/minutes; static HTML (doc 16 §16, Tier 1).
recipe_id: lausd-boarddocs
connector: boarddocs
version: 1

entity:
  entity_id: nces:0622710
  name: Los Angeles Unified School District
  state: CA
  kind: k12_district

schedule:
  cron: "0 5 * * *" # daily

fetch:
  respect_robots_txt: true
  politeness_seconds: 10
  jitter_seconds: 2

connector_config:
  boarddocs:
    state: ca
    subdomain: lausd

fields:
  title:
    selectors:
      - "h1.meeting-title"
      - ".agenda-header h2"
    required: true
  meeting_date:
    attr: datetime
    selectors:
      - ".meeting-date time"
      - "span.date time"
    required: false
  agenda_summary:
    selectors:
      - ".agenda-summary"
      - "div.summary"
    required: false

signal_types:
  - board_decision
  - budget
  - rfp_posted
