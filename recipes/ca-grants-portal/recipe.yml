# State portal — California Grants Portal (grants.ca.gov open-data feed)
# (doc 16 §14 recipes #18-22 grant/accountability portals; doc 18 §5 wave 2 #9).
# data.ca.gov is a CKAN catalog (not Socrata), so this instantiates the
# multi-tenant `ckan` connector (TODO D7) against the "California Grants Portal"
# datastore resource. Public open-data; no key required. Fields read the
# connector's JSON->HTML <dl> projection by data-key (the CKAN column names,
# which are CamelCase: Title, AgencyDept, …).
recipe_id: ca-grants-portal
connector: ckan
version: 1

entity:
  name: California Grants Portal
  state: CA
  kind: state_agency

schedule:
  cron: "0 6 * * *" # daily

fetch:
  respect_robots_txt: false
  politeness_seconds: 0

prefilter: assume_relevant

connector_config:
  ckan:
    domain: data.ca.gov
    # "California Grants Portal — Updated Daily" datastore resource (open grant
    # opportunities). Verified live against data.ca.gov CKAN datastore_search.
    resource_id: 111c8c88-21f6-453c-ae2c-b4785a0624f5
    page_size: 100
    max_pages: 20

fields:
  title:
    selectors:
      - "dd[data-key='Title']"
    required: true
  agency:
    selectors:
      - "dd[data-key='AgencyDept']"
    required: false
  funding_amount:
    selectors:
      - "dd[data-key='EstAvailFunds']"
      - "dd[data-key='EstAmounts']"
    required: false
  due_date:
    selectors:
      - "dd[data-key='ApplicationDeadline']"
    required: false

signal_types:
  - budget
  - rfp_posted
