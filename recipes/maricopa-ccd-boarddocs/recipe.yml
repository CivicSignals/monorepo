# Community-college wedge — Maricopa County Community College District board
# meetings via BoardDocs (doc 16 §14 recipes #41-60, #101-115 community
# colleges; doc 15 §3 wedge 2 "community colleges nationwide"). Instantiates the
# multi-tenant `boarddocs` connector (TODO D7) for one community-college
# district. Public governing-board agendas/minutes; static HTML (doc 16 §16,
# Tier 1).
recipe_id: maricopa-ccd-boarddocs
connector: boarddocs
version: 1

entity:
  entity_id: ipeds:104522
  name: Maricopa County Community College District
  state: AZ
  kind: community_college

schedule:
  cron: "0 5 * * *" # daily

fetch:
  respect_robots_txt: true
  politeness_seconds: 10
  jitter_seconds: 2

connector_config:
  boarddocs:
    state: az
    subdomain: mcccd

fields:
  title:
    selectors:
      - "h1.meeting-title"
      - ".agenda-header h2"
    required: true
  meeting_date:
    attr: datetime
    selectors:
      - ".meeting-date time"
      - "span.date time"
    required: false
  agenda_summary:
    selectors:
      - ".agenda-summary"
      - "div.summary"
    required: false

signal_types:
  - board_decision
  - budget
  - rfp_posted
