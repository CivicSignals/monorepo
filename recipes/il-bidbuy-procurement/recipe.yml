# State portal — Illinois BidBuy / Illinois Procurement Bulletin
# (doc 16 §14 recipe #15-17 "IL"; doc 18 §5 wave 1). Instantiates the generic
# `http_static` connector (TODO D6) for the Illinois procurement bulletin detail
# page. Public listings only; static HTML (doc 16 §17.1, §18).
recipe_id: il-bidbuy-procurement
connector: http_static
version: 1

entity:
  name: Illinois Department of Central Management Services
  state: IL
  kind: state_agency

schedule:
  cron: "0 */2 * * *" # every 2 hours

fetch:
  respect_robots_txt: true
  politeness_seconds: 10
  jitter_seconds: 2

prefilter: assume_relevant

fields:
  title:
    selectors:
      - "h1.bulletin-title"
      - ".bidbuy-header h2"
      - "main h1:first-of-type"
    required: true
  due_date:
    attr: datetime
    selectors:
      - ".response-due time"
      - "td.due-date time"
    required: false
  agency:
    selectors:
      - ".procuring-agency"
      - "td.agency"
    required: false

signal_types:
  - rfp_posted
  - contract_award
