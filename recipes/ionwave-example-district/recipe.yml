# Example recipe — school-district bids via IonWave (doc 18 §5 wave 3 #20).
# Instantiates the multi-tenant `ionwave` connector (TODO D8) for one tenant portal
# via its public bid-listing data API. Synthetic example: demonstrates per-tenant
# config + the `dd[data-key=...]` selectors over the connector's JSON->HTML
# projection. Public listings.
recipe_id: ionwave-example-district
connector: ionwave
version: 1

entity:
  name: Example Independent School District
  state: TX
  kind: school_district

schedule:
  cron: "0 9 * * *" # daily

fetch:
  respect_robots_txt: false
  politeness_seconds: 0

prefilter: assume_relevant

connector_config:
  ionwave:
    portal_url: https://exampleisd.ionwave.net
    listing_path: /Bids/Public/List
    items_path: bids
    page_size: 50
    max_pages: 10

fields:
  title:
    selectors:
      - "dd[data-key='title']"
    required: true
  bid_number:
    selectors:
      - "dd[data-key='bid_number']"
    required: false
  due_date:
    selectors:
      - "dd[data-key='close_date']"
    required: false
  department:
    selectors:
      - "dd[data-key='department']"
    required: false

signal_types:
  - rfp_posted
