# gitleaks configuration for CivicSignals
#
# Extends the default gitleaks ruleset and adds a narrow allowlist for a known
# class of false positives in our Kubernetes/Helm manifests.
title = "CivicSignals gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = """
Two classes of documented false positives:
1. Kubernetes manifests reference ConfigMap/Secret KEY NAMES via `key: <NAME>` inside
   `valueFrom` blocks (e.g. `key: S3_RAW_BUCKET`) — configuration key *names*, not secret
   values; the default `generic-api-key` rule false-positives on the uppercase key name.
2. Documentation under `docs-site/docs/` and `docs/` contains illustrative API/auth
   EXAMPLE snippets (Authorization: Bearer <token>, sample keys) that are placeholders,
   not real secrets. Real secrets must never live in documentation.
Neither suppresses real secret values committed in source/config.
"""
regexTarget = "line"
regexes = [
  '''^\s*key:\s*[A-Z][A-Z0-9_]+\s*$''',
]
paths = [
  '''docs-site/docs/.*\.mdx?$''',
  '''docs/.*\.md$''',
]
