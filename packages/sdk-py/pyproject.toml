[project]
name = "civicsignals-sdk"
version = "0.1.0"
description = "Python client for the CivicSignals REST API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["ruff>=0.7", "mypy>=1.12", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicsignals_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
