# API contract tests — schemathesis (QA-2).
#
# Property-based contract tests are loaded from the ASGI app in-process:
# no server, no network, no Docker needed in this job.  The OpenAPI schema
# is generated by FastAPI and exercised by schemathesis (Hypothesis-backed).
#
# Separate from ci.yml deliberately: QA-1 edits the e2e-smoke job in ci.yml
# in parallel, so this workflow lives in its own file to avoid conflicts.
#
# Coverage grows automatically as module routes land — schemathesis discovers
# new operations from the OpenAPI schema.  See tests/test_contract.py for the
# plan on expanding to authed endpoints once B1 (auth) merges.
name: API contract tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. force-push to a PR branch).
concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # schemathesis — in-process ASGI contract tests
  #
  # The FastAPI app factory (civicsignals_api.main:app) does not connect to
  # Postgres at import time (SQLAlchemy engine is lazy), so no service
  # containers are needed for the current public-surface tests.
  #
  # TODO QA-2: add Postgres + Redis service containers (mirroring ci.yml's
  # test job) when authed endpoints that hit the DB are added to the suite.
  # ---------------------------------------------------------------------------
  contract:
    name: schemathesis contract
    runs-on: ubuntu-latest
    env:
      # Minimal env so Settings() validates without a real .env file.
      ENVIRONMENT: development
      # Schemathesis runs against the ASGI app in-process; DB/Redis are not
      # contacted during the test, but pydantic-settings requires the fields
      # to be parseable.  These point at localhost which won't be used.
      DATABASE_URL: postgresql+asyncpg://civic:civic@localhost:5432/civicsignals_test
      DATABASE_DIRECT_URL: postgresql+asyncpg://civic:civic@localhost:5432/civicsignals_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install API deps (frozen lockfile)
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run schemathesis contract tests
        working-directory: apps/api
        # Select the contract suite by PATH, not `-k contract`: the keyword
        # filter also swept in unrelated DB-backed tests whose parametrize IDs
        # contain "contract" (e.g. signal types contract_awarded/contract_expiring),
        # which error here because this job has no Postgres service.
        # --no-cov keeps the run fast; coverage is collected in the main test job.
        # -v shows each parametrized operation so CI logs are easy to read.
        run: uv run pytest tests/test_contract.py -v --no-cov
