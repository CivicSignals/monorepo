name: Bug report
description: Report a problem with CivicSignals
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please **do not** report
        security vulnerabilities here — see [SECURITY.md](https://github.com/CivicSignals/monorepo/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: CivicSignals version or commit SHA.
      placeholder: "v0.1.0 or a git SHA"
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running CivicSignals?
      options:
        - CivicSignals Cloud (hosted)
        - Self-hosted (docker-compose)
        - Self-hosted (Helm/Kubernetes)
        - Local development
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any relevant log output. Redact secrets and PII.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to security@civicsignals.io).
          required: true
