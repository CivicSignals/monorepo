# Reverse proxy for the single-host self-host deployment (doc 06 §10 Phase 0).
# Routes /api/* and /docs and /healthz to the FastAPI backend; everything else
# to the Next.js frontend.
#
# TLS via Let's Encrypt / certbot is layered on top in tasks A4/A5.
# When TLS is active, add a second `server` block on port 443 with ssl_certificate
# directives pointing at /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem,
# and redirect port 80 to 443 (see docs/self-host/quickstart.md).
#
# SPDX-License-Identifier: AGPL-3.0-only

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- Logging ---
  log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_response_time":"$upstream_response_time"}';

  access_log /dev/stdout json_combined;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # --- Security headers (hardened baseline; see doc 06 §11) ---
  add_header X-Content-Type-Options  nosniff        always;
  add_header X-Frame-Options         SAMEORIGIN     always;
  add_header Referrer-Policy         strict-origin-when-cross-origin always;
  # CSP is set per-response by the Next.js app (more granular); omit here.

  # --- Rate limiting (protect auth endpoints) ---
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=50r/s;

  upstream api_upstream {
    server api:8000;
    keepalive 16;
  }

  upstream web_upstream {
    server web:3000;
    keepalive 16;
  }

  # ---------------------------------------------------------------------------
  # HTTP server (port 80)
  # In production with TLS enabled (tasks A4/A5), replace the proxy blocks
  # below with a simple redirect to HTTPS:
  #
  #   return 301 https://$host$request_uri;
  #
  # and add a second server block on port 443 with ssl_* directives.
  # ---------------------------------------------------------------------------
  server {
    listen 80 default_server;
    server_name _;

    # Max upload size (FOIA attachments + CSV imports; doc 06 §11)
    client_max_body_size 50m;

    # --- Health probe (used by docker compose healthcheck on nginx itself) ---
    location = /nginx-health {
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # --- API: FastAPI (uvicorn) ---
    # Matches /api/, /docs, /redoc, /openapi.json, /healthz
    location ~ ^/(api|docs|redoc|openapi\.json|healthz) {
      limit_req zone=api burst=100 nodelay;

      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";           # enable keepalive to upstream
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;

      proxy_connect_timeout 10s;
      proxy_read_timeout    120s;
      proxy_send_timeout    30s;
    }

    # Rate-limit the auth endpoints more aggressively
    location ~ ^/api/v[0-9]+/auth/ {
      limit_req zone=auth burst=10 nodelay;

      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection         "";
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # --- Frontend: Next.js ---
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection         "";
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;

      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
      proxy_send_timeout    30s;
    }
  }
}
