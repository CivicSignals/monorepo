# Reverse proxy for the single-host deployment (doc 06 §10 Phase 0).
# TLS via Let's Encrypt / certbot is layered on in TODO A4/A5; this is the
# HTTP-level routing skeleton: /api -> api, everything else -> web.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api_upstream { server api:8000; }
  upstream web_upstream { server web:3000; }

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
