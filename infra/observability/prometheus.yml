# Prometheus scrape configuration for the CivicSignals self-host stack (A6).
#
# Scrapes the FastAPI /metrics endpoint exposed by the `api` service.  The
# api container name is `civicsignals-api-1` in default Compose networking, but
# because Compose creates a DNS alias matching the service name we use `api`.
#
# Used by the `observability` Compose profile (see infra/docker-compose.yml).
# SPDX-License-Identifier: AGPL-3.0-only

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: civicsignals-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # OTel Collector self-monitoring (optional; comment out if not needed).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
