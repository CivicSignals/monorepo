# Promtail configuration for CivicSignals (A6).
#
# Tails Docker container stdout/stderr and ships JSON log lines to Loki.
# Each log line is already structured JSON (structlog output); Loki stores it
# and Grafana can query it with LogQL.
#
# Used by the `observability` Compose profile (see infra/docker-compose.yml).
# SPDX-License-Identifier: AGPL-3.0-only

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only tail containers that belong to the civicsignals Compose project.
          - name: label
            values: ["com.docker.compose.project=civicsignals"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
    pipeline_stages:
      # Parse the structlog JSON payload and promote fields to Loki labels.
      - json:
          expressions:
            level: level
            request_id: request_id
            workspace_id: workspace_id
      - labels:
          level:
          request_id:
          workspace_id:
