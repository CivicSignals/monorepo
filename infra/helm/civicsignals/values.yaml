# CivicSignals Helm values — doc 06 §10 (Phase 2 self-host K8s distribution)
# task O3
#
# Default: external/managed datastores (RDS + ElastiCache + S3).
# For evaluation, set bundled.postgres/redis/minio.enabled = true.
#
# Override any value with:  helm upgrade --install civicsignals ./infra/helm/civicsignals -f my-values.yaml
# SPDX-License-Identifier: AGPL-3.0-only

# ---------------------------------------------------------------------------
# Global image settings
# ---------------------------------------------------------------------------
image:
  api:
    repository: ghcr.io/civicsignals/api
    # tag defaults to .Chart.AppVersion (see helpers)
    tag: ""
    pullPolicy: IfNotPresent

  web:
    repository: ghcr.io/civicsignals/web
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ghcr-pull-secret

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Service account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# Pod-level settings (applies to all deployments unless overridden per-component)
# ---------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# Non-root security context (doc 06 §11)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Web frontend (Next.js)
# ---------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 2
  command: []  # uses image default
  args: []

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  service:
    type: ClusterIP
    port: 3000

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra env vars specific to the web container
  extraEnv: []
  # - name: NEXT_PUBLIC_API_URL
  #   value: "https://api.example.com"

# ---------------------------------------------------------------------------
# API (FastAPI / uvicorn) — process type: api
# ---------------------------------------------------------------------------
api:
  enabled: true
  replicaCount: 2
  command: ["/app/docker-entrypoint.sh"]
  args: ["api"]

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  service:
    type: ClusterIP
    port: 8000

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Worker: ingest  (queue=ingest)
# ---------------------------------------------------------------------------
workerIngest:
  enabled: true
  replicaCount: 2
  command: ["/app/docker-entrypoint.sh"]
  args: ["worker_ingest"]

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Worker: extract  (queue=extract) — LLM-heavy, higher memory limit
# ---------------------------------------------------------------------------
workerExtract:
  enabled: true
  replicaCount: 2
  command: ["/app/docker-entrypoint.sh"]
  args: ["worker_extract"]

  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Worker: score  (queue=score)
# ---------------------------------------------------------------------------
workerScore:
  enabled: true
  replicaCount: 1
  command: ["/app/docker-entrypoint.sh"]
  args: ["worker_score"]

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Worker: notify  (queue=notify)
# ---------------------------------------------------------------------------
workerNotify:
  enabled: true
  replicaCount: 1
  command: ["/app/docker-entrypoint.sh"]
  args: ["worker_notify"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Scheduler (Celery beat — SINGLETON, replicas always 1)
# Leader election via Redis lock is implemented in TODO D14.
# ---------------------------------------------------------------------------
scheduler:
  enabled: true
  # replicas is intentionally locked to 1 — do NOT scale this.
  replicaCount: 1
  command: ["/app/docker-entrypoint.sh"]
  args: ["scheduler"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ---------------------------------------------------------------------------
# Alembic migrate Job (Helm hook: pre-install + pre-upgrade)
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  # Hook weights — runs before api deployment starts
  hookWeight: "-5"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ---------------------------------------------------------------------------
# Ingress (web + api)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod

  # Web frontend
  web:
    host: civicsignals.example.com
    tls:
      enabled: false
      secretName: civicsignals-web-tls

  # API backend
  api:
    host: api.civicsignals.example.com
    # or use a path prefix on the same host:
    # pathPrefix: /api
    tls:
      enabled: false
      secretName: civicsignals-api-tls

# ---------------------------------------------------------------------------
# Application secrets (mounted as env vars from a K8s Secret)
# Set these via --set or a values override — never commit real values!
# ---------------------------------------------------------------------------
secrets:
  # Postgres connection strings (PgBouncer + direct)
  # In production, DATABASE_URL points at PgBouncer (port 6432).
  # DATABASE_DIRECT_URL bypasses it (port 5432) for Alembic, LISTEN/NOTIFY.
  databaseUrl: "postgresql+asyncpg://civicsignals:CHANGEME@pgbouncer:6432/civicsignals"
  databaseDirectUrl: "postgresql+psycopg://civicsignals:CHANGEME@postgres:5432/civicsignals"

  redisUrl: "redis://redis:6379/0"

  # S3 / MinIO credentials
  s3AccessKeyId: "CHANGEME"
  s3SecretAccessKey: "CHANGEME"

  # JWT / session signing key  (generate: openssl rand -hex 32)
  secretKey: "CHANGEME-32-byte-hex-secret-key-here"

  # LLM provider keys (leave empty to disable the provider)
  anthropicApiKey: ""
  openaiApiKey: ""

  # Email / SMTP (Resend SMTP or any SMTP relay)
  smtpHost: "smtp.resend.com"
  smtpPort: "587"
  smtpUser: "resend"
  smtpPassword: ""
  smtpFromEmail: "noreply@civicsignals.example.com"

  # Sentry (optional; leave empty to disable)
  sentryDsn: ""

# ---------------------------------------------------------------------------
# ConfigMap (non-secret runtime config)
# ---------------------------------------------------------------------------
config:
  # S3 endpoint — empty string = AWS S3; set to MinIO URL for bundled/eval
  s3Endpoint: ""
  s3Bucket: "civicsignals"
  s3Region: "us-east-1"

  # Log level: debug | info | warning | error
  logLevel: "info"

  # Feature flags
  enableSentry: "false"
  enableTelemetry: "true"   # anonymised, opt-in for self-host

  # API public base URL (used for webhook callbacks, email links)
  apiBaseUrl: "https://api.civicsignals.example.com"
  webBaseUrl: "https://civicsignals.example.com"

  # Celery concurrency per worker type
  celeryIngestConcurrency: "4"
  celeryExtractConcurrency: "2"
  celeryScoreConcurrency: "4"
  celeryNotifyConcurrency: "4"

# ---------------------------------------------------------------------------
# Bundled datastores (for evaluation / local K8s; NOT for production)
# Set bundled.*.enabled = true to deploy the subchart alongside the app.
# When enabled, values below override the subchart's own defaults.
# ---------------------------------------------------------------------------
bundled:
  postgres:
    enabled: false
    auth:
      username: civicsignals
      password: civicsignals
      database: civicsignals
    primary:
      persistence:
        enabled: true
        size: 10Gi
    # pgvector extension — handled via initdbScripts in bundled postgres
    initdbScripts:
      enable_pgvector.sql: |
        CREATE EXTENSION IF NOT EXISTS vector;

  redis:
    enabled: false
    auth:
      enabled: false
    master:
      persistence:
        enabled: true
        size: 2Gi

  minio:
    enabled: false
    auth:
      rootUser: civicsignals
      rootPassword: civicsignals
    defaultBuckets: "civicsignals"
    persistence:
      enabled: true
      size: 20Gi

# ---------------------------------------------------------------------------
# PgBouncer sidecar/deployment (transaction-mode connection pool)
# Only relevant when using external Postgres. For bundled postgres, you may
# disable PgBouncer and point DATABASE_URL directly at the Postgres service.
# ---------------------------------------------------------------------------
pgbouncer:
  enabled: true
  replicaCount: 1
  image:
    repository: edoburu/pgbouncer
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    port: 6432
