# CivicSignals — application secrets
# task O3 / doc 06 §11 (sealed-secrets on K8s)
# SPDX-License-Identifier: AGPL-3.0-only
#
# In production, replace this manifest with an ExternalSecret (ESO) or a
# SealedSecret that fetches from AWS Secrets Manager / Vault. The key names
# MUST match — only the source changes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "civicsignals.fullname" . }}-secret
  labels:
    {{- include "civicsignals.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from displaying secret values in diffs
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  DATABASE_DIRECT_URL: {{ .Values.secrets.databaseDirectUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  SMTP_FROM_EMAIL: {{ .Values.secrets.smtpFromEmail | quote }}
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | quote }}
