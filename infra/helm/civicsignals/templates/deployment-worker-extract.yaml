# CivicSignals — worker_extract Deployment (Celery, queue=extract)
# LLM-heavy workload — higher CPU/memory defaults.
# task O3 / doc 06 §1, §7, §10
# SPDX-License-Identifier: AGPL-3.0-only
{{- if .Values.workerExtract.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "civicsignals.fullname" . }}-worker-extract
  labels:
    {{- include "civicsignals.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-extract
spec:
  replicas: {{ .Values.workerExtract.replicaCount }}
  selector:
    matchLabels:
      {{- include "civicsignals.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-extract
  template:
    metadata:
      labels:
        {{- include "civicsignals.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-extract
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "civicsignals.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker-extract
          image: {{ include "civicsignals.apiImage" . }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command:
            {{- toYaml .Values.workerExtract.command | nindent 12 }}
          args:
            {{- toYaml .Values.workerExtract.args | nindent 12 }}
          env:
            {{- include "civicsignals.apiEnv" . | nindent 12 }}
            - name: CELERY_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "civicsignals.fullname" . }}-config
                  key: CELERY_EXTRACT_CONCURRENCY
            {{- with .Values.workerExtract.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.workerExtract.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.workerExtract.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerExtract.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerExtract.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
