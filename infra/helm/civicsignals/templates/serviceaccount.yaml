{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "civicsignals.serviceAccountName" . }}
  labels:
    {{- include "civicsignals.labels" . | nindent 4 }}
  annotations:
    # Run as an early hook so the ServiceAccount exists before the migrate Job (weight -5).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Configurable via serviceAccount.automountServiceAccountToken.
# Set to true (+ add SA annotations) for cloud IAM integrations
# such as AWS IRSA (EKS) or GKE Workload Identity.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
