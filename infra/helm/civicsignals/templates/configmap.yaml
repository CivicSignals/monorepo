# CivicSignals — non-secret runtime configuration
# task O3 / doc 06 §10
# SPDX-License-Identifier: AGPL-3.0-only
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "civicsignals.fullname" . }}-config
  labels:
    {{- include "civicsignals.labels" . | nindent 4 }}
data:
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENABLE_SENTRY: {{ .Values.config.enableSentry | quote }}
  ENABLE_TELEMETRY: {{ .Values.config.enableTelemetry | quote }}
  API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
  WEB_BASE_URL: {{ .Values.config.webBaseUrl | quote }}
  CELERY_INGEST_CONCURRENCY: {{ .Values.config.celeryIngestConcurrency | quote }}
  CELERY_EXTRACT_CONCURRENCY: {{ .Values.config.celeryExtractConcurrency | quote }}
  CELERY_SCORE_CONCURRENCY: {{ .Values.config.celeryScoreConcurrency | quote }}
  CELERY_NOTIFY_CONCURRENCY: {{ .Values.config.celeryNotifyConcurrency | quote }}
