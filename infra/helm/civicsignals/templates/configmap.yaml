# CivicSignals — non-secret runtime configuration
# Env var names match Settings in apps/api/src/civicsignals_api/config.py.
# task O3 / doc 06 §10
# SPDX-License-Identifier: AGPL-3.0-only
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "civicsignals.fullname" . }}-config
  labels:
    {{- include "civicsignals.labels" . | nindent 4 }}
  annotations:
    # Run as an early hook so the ConfigMap exists before the migrate Job (weight -5).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  # Settings.s3_endpoint_url (None = AWS S3; set for MinIO)
  S3_ENDPOINT_URL: {{ .Values.config.s3EndpointUrl | quote }}
  # Settings.s3_raw_bucket
  S3_RAW_BUCKET: {{ .Values.config.s3RawBucket | quote }}
  # Settings.s3_region
  S3_REGION: {{ .Values.config.s3Region | quote }}
  # Settings.log_level
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # Settings.environment
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  # Public URLs (informational; used in email links, webhooks)
  API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
  WEB_BASE_URL: {{ .Values.config.webBaseUrl | quote }}
