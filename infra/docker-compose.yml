# Single-host production / self-host quickstart (doc 06 §10 Phase 0 + Phase 2).
# Env-vars-only config, persistent volumes, published images from GHCR.
#
# QUICK START (see docs/self-host/quickstart.md for details):
#   cp infra/.env.example infra/.env  # fill in secrets
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
#   docker compose -f infra/docker-compose.yml --env-file infra/.env run --rm init
#
# UPGRADE (see docs/self-host/upgrade.md for full procedure):
#   docker compose -f infra/docker-compose.yml --env-file infra/.env pull
#   docker compose -f infra/docker-compose.yml --env-file infra/.env run --rm migrate
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
#
# Images published by .github/workflows/release-images.yml (task O1):
#   ghcr.io/civicsignals/api:<CIVIC_VERSION>
#   ghcr.io/civicsignals/web:<CIVIC_VERSION>
#
# Build fallback: if the GHCR images are not available (e.g. a dev branch),
# run with --build to build locally:
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#
# SPDX-License-Identifier: AGPL-3.0-only

name: civicsignals

# ---------------------------------------------------------------------------
# Shared defaults for all api process types (one image, six process types).
# The 'command' field selects which process type runs inside the container.
# Each service merges these defaults with YAML merge key (<<:).
# ---------------------------------------------------------------------------
x-api-defaults: &api-defaults
  image: ghcr.io/civicsignals/api:${CIVIC_VERSION:-latest}
  build:
    context: ../apps/api
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - internal
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  # ---------------------------------------------------------------------------
  # Infrastructure — Postgres 16 + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Infrastructure — PgBouncer (transaction-mode connection pool, doc 06 §4)
  # App processes connect to port 6432 (DATABASE_URL).
  # Alembic + long jobs bypass to port 5432 directly (DATABASE_DIRECT_URL).
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      SERVER_RESET_QUERY: DISCARD ALL
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Infrastructure — Redis (Celery broker + cache; AOF persistence)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Infrastructure — MinIO (S3-compatible object storage).
  # To use external S3 instead: remove this service and minio-init, set
  # S3_ENDPOINT_URL to empty (native AWS S3) or your provider's endpoint.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # One-shot: create the raw-documents bucket (idempotent; exits 0 on success).
  minio-init:
    image: minio/mc:latest
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_RAW_BUCKET: ${S3_RAW_BUCKET:-civic-raw}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb --ignore-existing local/$$S3_RAW_BUCKET
        echo "minio-init: bucket '$$S3_RAW_BUCKET' is ready"

  # ---------------------------------------------------------------------------
  # One-shot migrate: runs `alembic upgrade head` against the direct Postgres
  # connection (DATABASE_DIRECT_URL, port 5432 — bypasses PgBouncer transaction
  # mode which is incompatible with DDL; see doc 06 §4).
  #
  # All long-running app services (api, workers, scheduler) declare
  # `depends_on: migrate: condition: service_completed_successfully` so they
  # never start against a schema that is behind the current code revision.
  #
  # `alembic upgrade head` is a no-op when the schema is already current, so
  # this container is safe to run on every `docker compose up` and on upgrades.
  #
  # To run migrations explicitly (e.g. during an upgrade before restarting
  # services):
  #   docker compose -f infra/docker-compose.yml --env-file infra/.env \
  #     run --rm migrate
  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/civicsignals/api:${CIVIC_VERSION:-latest}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: ["migrate"]
    env_file:
      - .env
    restart: "no"
    networks:
      - internal
    # Migrations bypass PgBouncer and go straight to Postgres on port 5432
    # (DATABASE_DIRECT_URL). Only postgres needs to be healthy; pgbouncer and
    # minio are not required.
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # One-shot init container: Alembic migrations + admin seed.
  #
  # Run on first boot and after each version upgrade:
  #   docker compose --env-file infra/.env run --rm init
  #
  # The `init` profile means this service is excluded from `up` by default
  # (it only runs when explicitly called with `run --rm init`).
  # ---------------------------------------------------------------------------
  init:
    <<: *api-defaults
    command: ["init"]
    restart: "no"
    # Override depends_on: init talks to postgres directly (DATABASE_DIRECT_URL),
    # so it only needs postgres healthy, not pgbouncer or minio-init.
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - init

  # ---------------------------------------------------------------------------
  # API process types — all use the same ghcr.io/civicsignals/api image.
  # The entrypoint selects the process based on the 'command' argument.
  # ---------------------------------------------------------------------------
  api:
    <<: *api-defaults
    command: ["api"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "
          import urllib.request, sys;
          try:
            r = urllib.request.urlopen('http://localhost:8000/healthz', timeout=5);
            sys.exit(0 if r.status == 200 else 1)
          except Exception:
            sys.exit(1)
          "
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # worker_ingest renders JS-heavy pages with Playwright (D2), so it builds the
  # `worker` Dockerfile stage (final + Chromium + the `ingestion` extra) rather
  # than the lean api image the other process types share. Tagged distinctly so
  # the two images don't clobber each other in the local cache.
  worker_ingest:
    <<: *api-defaults
    image: ghcr.io/civicsignals/api-worker:${CIVIC_VERSION:-latest}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: worker
      args:
        EXTRAS: ingestion
    command: ["worker_ingest"]

  worker_extract:
    <<: *api-defaults
    command: ["worker_extract"]

  worker_score:
    <<: *api-defaults
    command: ["worker_score"]

  worker_notify:
    <<: *api-defaults
    command: ["worker_notify"]

  scheduler:
    <<: *api-defaults
    command: ["scheduler"]

  # ---------------------------------------------------------------------------
  # Web frontend
  # ---------------------------------------------------------------------------
  web:
    image: ghcr.io/civicsignals/web:${CIVIC_VERSION:-latest}
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          node -e "
          var h = require('http');
          h.get('http://localhost:3000/', function(r) {
            process.exit(r.statusCode < 500 ? 0 : 1);
          }).on('error', function() { process.exit(1); });
          "
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Reverse proxy — nginx routes /api/* → api:8000, everything else → web:3000.
  # TLS via Let's Encrypt / certbot is layered on top in tasks A4/A5.
  # The nginx/nginx.conf file is volume-mounted so operators can customise it.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certdata:/etc/letsencrypt:ro
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observability stack (A6) — optional; activate with:
  #   docker compose -f infra/docker-compose.yml --profile observability up -d
  #
  # Services: OTel Collector, Prometheus, Loki, Promtail, Grafana, Tempo.
  # All data is persisted in named volumes.  Access Grafana at :3100 on the
  # host (override GRAFANA_PORT in .env if needed).
  #
  # To connect the api to the collector, add to .env:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
  #
  # See docs/self-host/observability.md for full setup instructions.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - tempodata:/var/tempo
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - observability
    # Inline Tempo config -- enough to receive OTLP and serve Grafana queries.
    configs:
      - source: tempo_config
        target: /etc/tempo.yml

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - observability

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: ""
      # Provisioning dir holds datasources/ + dashboards/ provider configs (A6).
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafanadata:/var/lib/grafana
      # Provisioned data sources (Prometheus default, Loki, Tempo) and the
      # dashboard file-provider config — loaded on startup, no manual setup.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Starter dashboards loaded by the file-provider above.
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo

# ---------------------------------------------------------------------------
# Configs (inline for services that need small config files without a volume).
# ---------------------------------------------------------------------------
configs:
  tempo_config:
    content: |
      stream_over_http_enabled: true
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: "0.0.0.0:4317"
              http:
                endpoint: "0.0.0.0:4318"
      ingester:
        lifecycler:
          ring:
            kvstore:
              store: memberlist
            replication_factor: 1
          final_sleep: 0s
        flush_check_period: 10s
        flush_op_timeout: 10m
        complete_block_timeout: 15m
        close_idle_period: 10m
        max_block_duration: 5m
      memberlist:
        bind_addr: ["0.0.0.0"]
        bind_port: 7946
        join_members: []
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal
      compactor:
        compaction:
          block_retention: 336h
      query_frontend:
        search:
          duration_slo: 5s
          throughput_bytes_slo: 1.073741824e+09

# ---------------------------------------------------------------------------
# Named volumes — persistent across container restarts and upgrades.
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  certdata:
    driver: local
  prometheusdata:
    driver: local
  lokidata:
    driver: local
  tempodata:
    driver: local
  grafanadata:
    driver: local

# ---------------------------------------------------------------------------
# Network — all services communicate on an internal bridge; only nginx is
# reachable from the host via the ports published above.
# ---------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
