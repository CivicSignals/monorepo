# Single-host production / self-host quickstart (doc 06 §10 Phase 0 + Phase 2).
# Env-vars-only config, persistent volumes, published images. This is the file a
# self-hoster runs. The full quickstart hardening lands in TODO O2.
#
# Set image tags + secrets via a .env file next to this compose.

name: civicsignals

x-api-image: &api-image
  image: ghcr.io/civicsignals/api:${CIVIC_VERSION:-latest}
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    - pgbouncer
    - redis
    - minio

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  api:
    <<: *api-image
    command: ["api"]
    ports:
      - "8000:8000"

  worker_ingest:
    <<: *api-image
    command: ["worker_ingest"]
  worker_extract:
    <<: *api-image
    command: ["worker_extract"]
  worker_score:
    <<: *api-image
    command: ["worker_score"]
  worker_notify:
    <<: *api-image
    command: ["worker_notify"]
  scheduler:
    <<: *api-image
    command: ["scheduler"]

  web:
    image: ghcr.io/civicsignals/web:${CIVIC_VERSION:-latest}
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
