# Local development stack (TODO A2). Brings up Postgres 16 (+pgvector), Redis,
# Mailpit, MinIO, PgBouncer, the API, the four worker process types, the
# scheduler, and the web app. `make dev` runs this.
#
# This mirrors the Phase 0 single-VPS production layout (doc 06 §10) so we
# dogfood the self-host distribution from day one.
#
# Startup ordering (enforced via healthchecks + depends_on):
#   postgres (healthy) -> pgbouncer (healthy)
#   pgbouncer/redis/minio (healthy) -> migrate (runs `alembic upgrade head`)
#   migrate (completed) -> api + 4 workers + scheduler
#   api (healthy) -> web

name: civicsignals-dev

# Shared build context for every process spawned from the API image. The image
# is one artifact; the process type is chosen by the entrypoint arg (doc 18 §6.1).
x-api-image: &api-image
  build:
    context: ../apps/api
    dockerfile: Dockerfile
    # Build the lean `final` stage — NOT the Dockerfile's last stage (`worker`,
    # which runs `playwright install` and is only for the headless ingest worker).
    # `extraction` installs the LLM SDKs (anthropic/openai) the extract worker +
    # smart-search need.
    target: final
    args:
      EXTRAS: extraction
  env_file:
    - ../.env
  environment:
    # The recipes/ and recipe-schema live at the repo root — outside the apps/api
    # build context/image — so mount them and point the runner at them (otherwise
    # recipes_dir()/recipe_schema_dir() can't find the repo root in the container).
    RECIPES_DIR: /recipes
    RECIPE_SCHEMA_DIR: /recipe-schema
  volumes:
    - ../apps/api:/app
    # Anonymous volume so the image's container-built venv at /app/.venv is NOT
    # shadowed by a host-built apps/api/.venv (whose scripts have host-absolute
    # shebangs the container can't execute → exit 126 "bad interpreter").
    - /app/.venv
    - ../recipes:/recipes:ro
    - ../packages/recipe-schema/schema:/recipe-schema:ro
  restart: unless-stopped

# Backing-service dependency block reused by every long-running API process.
# `migrate` is the gate: app processes only start once schema is current.
x-api-deps: &api-deps
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic}
      POSTGRES_DB: ${POSTGRES_DB:-civicsignals}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic} -d ${POSTGRES_DB:-civicsignals}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-civic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-civic}
      DB_NAME: ${POSTGRES_DB:-civicsignals}
      # edoburu/pgbouncer defaults to listening on 5432; the rest of the stack
      # (healthcheck, port map, app DATABASE_URL=pgbouncer:6432) expects 6432.
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # edoburu/pgbouncer ships `nc` (but NOT bash) — a TCP open on 6432 confirms
      # the pooler is accepting connections before app processes dial in.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-civic}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-civic-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # The server image ships curl; hit MinIO's built-in liveness endpoint.
      # (Don't use `mc ready local` here — no `local` alias is configured in the
      # server container, so it would hang and never report healthy.)
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: ensure the bucket the API/workers write raw docs to exists (TODO D3).
  minio-init:
    image: minio/mc:latest
    env_file:
      - ../.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local "$${S3_ENDPOINT_URL:-http://minio:9000}" \
          "$${S3_ACCESS_KEY_ID:-civic}" "$${S3_SECRET_ACCESS_KEY:-civic-secret}" &&
        mc mb --ignore-existing "local/$${S3_RAW_BUCKET:-civic-raw}"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: apply Alembic migrations, then exit. App processes wait on this via
  # `service_completed_successfully`, so a fresh stack always starts migrated.
  # Runs against the *direct* Postgres URL (alembic/env.py picks that), bypassing
  # PgBouncer transaction-mode pooling (doc 06 §4, doc 18 §6.3).
  migrate:
    <<: *api-image
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*api-image, *api-deps]
    command: ["api"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # worker_ingest carries Playwright + Chromium for the headless-browser fetcher
  # (D2): it builds the `worker` Dockerfile stage with the `ingestion` extra,
  # unlike the other process types on the lean image. NB: the dev stack volume-
  # mounts ../apps/api over /app, so to render pages locally also install the
  # browser into the mounted venv:
  #   docker compose -f infra/docker-compose.dev.yml exec worker_ingest \
  #     uv run --extra ingestion playwright install chromium
  worker_ingest:
    <<: [*api-image, *api-deps]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      # Headless browsing (D2/D9) is deferred — build the lean `final` stage (no
      # Chromium download). The `ingestion` extra provides feedparser/httpx/bs4 for
      # RSS/HTTP/Socrata/etc. To enable browser recipes later, switch to
      # `target: worker` (which also runs `playwright install --with-deps chromium`).
      target: final
      args:
        EXTRAS: ingestion
    command: ["worker_ingest"]

  worker_extract:
    <<: [*api-image, *api-deps]
    command: ["worker_extract"]

  worker_score:
    <<: [*api-image, *api-deps]
    command: ["worker_score"]

  worker_notify:
    <<: [*api-image, *api-deps]
    command: ["worker_notify"]

  scheduler:
    <<: [*api-image, *api-deps]
    command: ["scheduler"]

  web:
    image: node:22-bookworm-slim
    working_dir: /repo
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm --filter @civicsignals/web dev"]
    environment:
      # Overridable so the web can be exposed publicly (e.g. via Tailscale Funnel):
      # set NEXT_PUBLIC_API_BASE_URL in .env to the public same-origin API URL.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      # Subpath prefix when served behind a shared proxy (e.g. /civic); empty = root.
      # Must match the /civic carried by NEXT_PUBLIC_API_BASE_URL and the proxy route.
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    ports:
      - "3000:3000"
    volumes:
      - ../:/repo
      - web_node_modules:/repo/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  web_node_modules:
