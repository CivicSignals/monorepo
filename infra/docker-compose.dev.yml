# Local development stack (TODO A2). Brings up Postgres 16 (+pgvector), Redis,
# Mailpit, MinIO, PgBouncer, the API, the four worker process types, the
# scheduler, and the web app. `make dev` runs this.
#
# This mirrors the Phase 0 single-VPS production layout (doc 06 §10) so we
# dogfood the self-host distribution from day one.

name: civicsignals-dev

x-api-build: &api-build
  build:
    context: ../apps/api
    dockerfile: Dockerfile
  env_file:
    - ../.env
  volumes:
    - ../apps/api:/app
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_started
    minio:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic}
      POSTGRES_DB: ${POSTGRES_DB:-civicsignals}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-civic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-civic}
      DB_NAME: ${POSTGRES_DB:-civicsignals}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-civic}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-civic-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  api:
    <<: *api-build
    command: ["api"]
    ports:
      - "8000:8000"

  worker_ingest:
    <<: *api-build
    command: ["worker_ingest"]

  worker_extract:
    <<: *api-build
    command: ["worker_extract"]

  worker_score:
    <<: *api-build
    command: ["worker_score"]

  worker_notify:
    <<: *api-build
    command: ["worker_notify"]

  scheduler:
    <<: *api-build
    command: ["scheduler"]

  web:
    image: node:22-bookworm-slim
    working_dir: /repo
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm --filter @civicsignals/web dev"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../:/repo
      - web_node_modules:/repo/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
  web_node_modules:
